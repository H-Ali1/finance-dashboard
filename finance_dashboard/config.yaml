# Home Assistant App definition. CI publishes it, with the release's version
# filled in, to the `ha-release` branch that Home Assistant watches, and pushes
# the matching images to GitHub Container Registry. Each release bumps the
# patch number automatically; raise `version` here only for a bigger jump
# (1.2.0, 2.0.0).
name: Finance Dashboard
version: "1.1.1"
slug: finance_dashboard
description: Spending, budgets, subscriptions and net worth across your own accounts.
url: https://github.com/H-Ali1/finance-dashboard
# {arch} becomes aarch64 (Home Assistant Green) or amd64.
image: "ghcr.io/h-ali1/{arch}-finance-dashboard"
arch:
  - aarch64
  - amd64
startup: application
boot: auto

# Opens in the HA sidebar, behind HA's own login. No port is published.
ingress: true
ingress_port: 8099
panel_icon: mdi:finance
panel_title: Finance
panel_admin: true

# Restart the container if the health check fails: the process died, the
# database stopped answering, or the background jobs stopped.
watchdog: "http://[HOST]:[PORT:8099]/api/health"

# Stop the app while a backup runs, so the SQLite file is copied consistently.
backup: cold
# The App keeps its own rolling daily copies; HA backups don't need them too.
backup_exclude:
  - "backups/*"

environment:
  # Only the Supervisor's ingress proxy may connect.
  ALLOWED_CLIENT_IPS: "172.30.32.2"

options:
  sync_interval_hours: 6
schema:
  starling_access_token: password?
  trading212_api_key: password?
  trading212_api_secret: password?
  trading212_api_key_2: password?
  trading212_api_secret_2: password?
  trading212_base_url: url?
  sync_interval_hours: float(0,24)
  essential_categories: str?
