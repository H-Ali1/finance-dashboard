configuration:
  starling_access_token:
    name: Starling personal access token
    description: >-
      From developer.starlingbank.com, Personal access. Tick only
      account:read, account-list:read, balance:read, transaction:read,
      savings-goal:read and space:read.
  trading212_api_key:
    name: Trading 212 API key
    description: >-
      Trading 212 app, Settings, API, Generate API key. Tick only the "account"
      and "portfolio" read permissions. Each key belongs to one account.
  trading212_api_secret:
    name: Trading 212 API secret
    description: Shown once, alongside the key, when you generate it.
  trading212_api_key_2:
    name: Trading 212 API key (second account)
    description: >-
      Optional. If you have both an Invest account and a Stocks ISA, generate
      a key from the other one too.
  trading212_api_secret_2:
    name: Trading 212 API secret (second account)
    description: The secret that came with the second key.
  trading212_base_url:
    name: Trading 212 API address
    description: >-
      Leave blank for your live account. Use https://demo.trading212.com/api/v0
      to try a practice account.
  truelayer_client_id:
    name: TrueLayer client ID
    description: >-
      For HSBC, Amex and other UK banks. From console.truelayer.com, with the
      app switched to Live (the ID doesn't start with sandbox-). Banks are then
      connected on the dashboard's Connections tab.
  truelayer_client_secret:
    name: TrueLayer client secret
    description: Shown in TrueLayer Console next to the client ID.
  sync_interval_hours:
    name: Sync every (hours)
    description: >-
      How often to pull from Starling, Trading 212 and TrueLayer banks and
      record the day's net worth. TrueLayer banks are read at most every 8
      hours, to stay inside the banks' daily limit. 0 turns automatic syncing
      off; the Sync button still works.
  essential_categories:
    name: Essential categories
    description: >-
      Comma-separated categories counted as unavoidable for the runway and
      essential-spend figures. Leave blank for the default list.
